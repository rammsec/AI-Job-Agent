name: Daily Job Scan

on:
  schedule:
    # 07:00 UTC = 6:00 PM AEDT (UTC+11) / 5:00 PM AEST (UTC+10)
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run job scan and export site data
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          CANDIDATE_PROFILE_JSON: ${{ secrets.CANDIDATE_PROFILE_JSON }}
        run: |
          python -m src.export_site_data

      - name: Commit and push updated job listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json
          if git diff --cached --quiet; then
            echo "No changes to docs/data/jobs.json"
          else
            git commit -m "Update daily job matches [skip ci]"
            git push
          fi
